name: JTS Brand Compliance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate JTS design and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: Jefferies-Tube-Solutions/jts-brand-checks@636d896ab6e7d0caecf65955485c4c6aa49c9393
